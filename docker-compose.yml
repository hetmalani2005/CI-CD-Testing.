
services:
  app:
    image: python:3.12-alpine
    container_name: test_application
    working_dir: /app
    volumes:
      - ./app:/app:ro
    command: python -m http.server 8000 --bind 0.0.0.0
    ports:
      - "8000:8000"

  chrome:
    image: selenium/standalone-chrome:latest
    container_name: selenium_chrome
    shm_size: 2gb
    ports:
      - "4444:4444"

  tests:
    build: .
    container_name: selenium_tests
    working_dir: /workspace
    volumes:
      - .:/workspace
    depends_on:
      - app
      - chrome
    command: pytest -v tests/ --junitxml=report.xml
